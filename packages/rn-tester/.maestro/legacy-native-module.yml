appId: ${APP_ID} # iOS: com.meta.RNTester.localDevelopment | Android: com.facebook.react.uiapp
---
- launchApp
# Wait for the JS bundle to render the landing screen instead of asserting
# immediately, which races app cold start on CI.
- extendedWaitUntil:
    visible:
      text: 'Components'
    timeout: 30000
- openLink: rntester://example/LegacyModule/SampleLegacyModule
- extendedWaitUntil:
    visible:
      id: 'run-all-tests'
    timeout: 10000
- tapOn:
    id: 'run-all-tests'
- assertVisible:
    id: 'voidFunc-result'
- assertVisible:
    id: 'getBool-result'
    text: 'true'
- assertVisible:
    id: 'getEnum-result'
    text: '1'
- assertVisible:
    id: 'getDouble-result'
    text: '99.95'
- assertVisible:
    id: 'getInt-result'
    text: '99'
- assertVisible:
    id: 'getFloat-result'
    text: '99.94999694824219'
- scrollUntilVisible:
    element:
      id: 'getObjectFloat-result'
    direction: DOWN
    speed: 40
- assertVisible:
    id: 'getObjectDouble-result'
    text: '99.95'
- assertVisible:
    id: 'getObjectInteger-result'
    text: '99'
- assertVisible:
    id: 'getObjectFloat-result'
    text: '99.94999694824219'
- scrollUntilVisible:
    element:
      id: 'getValue-result'
    direction: DOWN
    speed: 40
- assertVisible:
    id: 'getString-result'
    text: '.*Hello.*'
- assertVisible:
    id: 'getRootTag-result'
    text: '11'
- assertVisible:
    id: 'getObject-result'
    text: '.*foo.*'
- assertVisible:
    id: 'getUnsafeObject-result'
    text: '.*foo.*'
- assertVisible:
    id: 'getValue-result'
    text: '.*test.*'
- scrollUntilVisible:
    element:
      id: 'getDynamicWithMap-result'
    direction: DOWN
    speed: 40
- assertVisible:
    id: 'getDynamicWithNull-result'
    text: '.*Null.*'
- assertVisible:
    id: 'getDynamicWithBoolean-result'
    text: '.*Boolean.*'
- assertVisible:
    id: 'getDynamicWithNumber-result'
    text: '.*42.*'
- assertVisible:
    id: 'getDynamicWithString-result'
    text: '.*The answer is 42.*'
- assertVisible:
    id: 'getDynamicWithArray-result'
    text: '.*the.*'
- assertVisible:
    id: 'getDynamicWithMap-result'
    text: '.*answer.*'
- scrollUntilVisible:
    element:
      id: 'getConstants-result'
    direction: DOWN
    speed: 40
- assertVisible:
    id: 'callback-result'
    text: 'Value From Callback'
- assertVisible:
    id: 'getArray-result'
    text: '.*foo.*'
- assertVisible:
    id: 'promise-result'
    text: 'result'
- assertVisible:
    id: 'rejectPromise-result'
    text: 'intentional promise rejection'
- assertVisible:
    id: 'getConstants-result'
    text: '.*something.*'
- scrollUntilVisible:
    element:
      id: 'getConst3-result'
    direction: DOWN
    speed: 40
- assertVisible:
    id: 'getConst1-result'
    text: 'true'
- assertVisible:
    id: 'getConst2-result'
    text: '390'
- assertVisible:
    id: 'getConst3-result'
    text: '.*something.*'
